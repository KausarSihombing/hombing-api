<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Loker IT Terbaik</title>
    <style>
        /* Gaya Dasar */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 850px; margin: auto; }
        h1 { text-align: center; color: #0d3880; margin-bottom: 5px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; }
        
        /* Area Tombol */
        .btn-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .btn { 
            padding: 12px 25px; font-size: 15px; font-weight: bold; border: none; 
            border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-lokal { background-color: #1a73e8; color: white; }
        .btn-global { background-color: #28a745; color: white; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }

        /* Gaya Kartu Loker */
        .job-card { 
            background: white; padding: 25px; margin-bottom: 20px; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative;
            border-left: 6px solid #1a73e8; transition: 0.3s;
        }
        .job-card:hover { box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .job-card.global-style { border-left-color: #28a745; }

        /* Header Kartu (Tanpa Logo) */
        .card-header { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .company-name { font-size: 22px; font-weight: bold; margin: 0; color: #0d3880; }
        .job-title { font-size: 18px; font-weight: bold; margin: 8px 0 0 0; color: #444; }

        /* Badge Sumber */
        .source-badge { 
            position: absolute; top: 25px; right: 25px; background: #e8f0fe; 
            color: #1a73e8; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; 
        }

        /* Info Detail & Tautan Maps */
        .job-details { font-size: 14px; color: #555; margin-bottom: 15px; line-height: 1.8; }
        .map-link { 
            color: #d93025; text-decoration: none; font-weight: bold; 
            background-color: #fce8e6; padding: 3px 8px; border-radius: 5px; margin-left: 5px;
        }
        .map-link:hover { background-color: #fad2cf; text-decoration: underline; }

        /* Area Tag Skill */
        .skill-section-title { font-size: 13px; font-weight: bold; color: #777; margin-bottom: 8px; text-transform: uppercase; }
        .skill-tag { 
            background: #f1f3f4; color: #3c4043; padding: 6px 14px; 
            border-radius: 20px; font-size: 12px; margin-right: 8px; margin-bottom: 8px; 
            display: inline-block; font-weight: 600; border: 1px solid #dadce0;
        }
        
        #loading { text-align: center; color: #666; font-style: italic; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 Portal Karir IT Pro</h1>
        <p class="subtitle">Temukan pekerjaan impianmu di perusahaan teknologi terkemuka</p>

        <!-- TOMBOL PILIHAN API -->
        <div class="btn-container">
            <button class="btn btn-lokal" onclick="ambilData('lokal')">🇮🇩 Tampilkan Loker Indonesia</button>
            <button class="btn btn-global" onclick="ambilData('global')">🌍 Tampilkan Loker Internasional</button>
        </div>

        <div id="loading">Sedang menyinkronkan data dengan server... ⏳</div>
        <div id="wadah-loker">
            <!-- Data akan muncul di sini -->
        </div>
    </div>

    <script>
        async function ambilData(tipe) {
            const wadah = document.getElementById('wadah-loker');
            const loading = document.getElementById('loading');
            
            wadah.innerHTML = '';
            loading.style.display = 'block';

            const urlAPI = tipe === 'lokal' ? '/api/loker-lokal' : '/api/loker-global';
            try {
                const response = await fetch(urlAPI);
                const result = await response.json();
                
                loading.style.display = 'none'; 

                result.lowongan.forEach(loker => {
                    const card = document.createElement('div');
                    card.classList.add('job-card');
                    
                    if(tipe === 'global') card.classList.add('global-style');

                    const mapsQuery = encodeURIComponent(`${loker.nama_perusahaan} ${loker.lokasi}`);
                    const urlMaps = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;

                    // HTML Kartu Loker yang Lebih Bersih Tanpa Logo
                    card.innerHTML = `
                        <div class="source-badge">${tipe === 'lokal' ? '🇮🇩' : '🌍'} ${loker.sumber}</div>
                        
                        <div class="card-header">
                            <h2 class="company-name">🏢 ${loker.nama_perusahaan}</h2>
                            <p class="job-title">💻 ${loker.posisi}</p>
                        </div>

                        <div class="job-details">
                            🎓 <strong>Pendidikan:</strong> ${loker.pendidikan} <br>
                            📅 <strong>Tanggal Buka:</strong> ${loker.tanggal_buka} <br>
                            📍 <strong>Lokasi:</strong> ${loker.lokasi} 
                            <a href="${urlMaps}" target="_blank" class="map-link">Buka di Maps 🗺️</a>
                        </div>
                        
                        <div class="skill-section-title">Syarat Keahlian (IT Skills):</div>
                    `;

                    const skillContainer = document.createElement('div');
                    loker.skill_it.forEach(skill => {
                        const skillTag = document.createElement('span');
                        skillTag.classList.add('skill-tag');
                        skillTag.textContent = skill;
                        skillContainer.appendChild(skillTag);
                    });

                    card.appendChild(skillContainer);
                    wadah.appendChild(card);
                });

            } catch (error) {
                loading.style.display = 'none';
                wadah.innerHTML = '<p style="text-align: center; color: red;">Gagal terhubung ke Server. Pastikan terminal "node server.js" sudah menyala!</p>';
            }
        }

        window.onload = () => ambilData('lokal');
    </script>

</body>
</html>
